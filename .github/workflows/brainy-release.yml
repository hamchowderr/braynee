name: Release brainy plugin (zip + GitHub Release)

# Builds a hosted brainy.zip and attaches it to a GitHub Release so users can
# install without adding the marketplace:
#   claude --plugin-url https://github.com/<owner>/<repo>/releases/download/brainy--v<ver>/brainy.zip
#
# Trigger: push a tag of the form `brainy--v<version>` — exactly what
# `claude plugin tag plugins/brainy` produces (it also validates that
# plugin.json and the marketplace entry agree before tagging).

on:
  push:
    tags:
      - 'brainy--v*'

permissions:
  contents: write

jobs:
  release:
    name: build + publish brainy.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches plugin.json and marketplace agree
        shell: bash
        run: |
          node -e "
          const p = require('./plugins/brainy/.claude-plugin/plugin.json');
          const mp = require('./.claude-plugin/marketplace.json').plugins.find(x => x.name === 'brainy');
          if (!mp) throw new Error('brainy missing from marketplace.json');
          if (p.version !== mp.version) throw new Error('version mismatch: plugin.json ' + p.version + ' vs marketplace ' + mp.version);
          const tag = process.env.GITHUB_REF_NAME;
          if (tag !== 'brainy--v' + p.version) throw new Error('tag ' + tag + ' != brainy--v' + p.version);
          console.log('OK: ' + tag + ' agrees with plugin.json/marketplace v' + p.version);
          "

      - name: Validate plugin before packaging
        shell: bash
        run: node plugins/brainy/bin/brainy-self-test

      - name: Build brainy.zip
        shell: bash
        run: |
          cd plugins
          zip -r ../brainy.zip brainy \
            -x '*/node_modules/*' '*/.git/*' '*/.DS_Store'
          cd ..
          unzip -l brainy.zip | tail -3

      - name: Release notes
        shell: bash
        run: |
          VER=$(node -p "require('./plugins/brainy/.claude-plugin/plugin.json').version")
          ASSET="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/brainy.zip"
          {
            echo "Brainy v${VER} — install without adding a marketplace:"
            echo ''
            echo '```'
            echo "claude --plugin-url ${ASSET}"
            echo '```'
            echo ''
            echo 'Requires Claude Code >= v2.1.128 for zip/URL plugin loading'
            echo '(>= v2.1.85 for the hook `if`-scoping the plugin relies on).'
            echo ''
            echo 'Marketplace install remains the primary path:'
            echo '`claude plugin marketplace add hamchowderr/claude-plugins`'
            echo 'then `claude plugin install brainy@hamch-plugins`.'
          } > RELEASE_NOTES.md

      - name: Create GitHub Release with asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" brainy.zip \
            --title "brainy ${GITHUB_REF_NAME#brainy--}" \
            --notes-file RELEASE_NOTES.md
