# GENERATED by scripts/gen-pr-standards.mjs from braynee's shared commit types.
# Do not edit by hand: change scripts/lib/ci-workflow-core.js and regenerate. (cp-0wyf)
#
# Reusable PR standards check. A repo calls it with a short caller workflow:
#   node scripts/gen-pr-standards.mjs --caller "<prefix> [<prefix> ...]"
name: PR standards

on:
  workflow_call:
    inputs:
      prefixes:
        description: Space-separated beads issue prefixes this repo accepts (e.g. "waas-api waas")
        required: true
        type: string
      loc-warn:
        description: Changed-line count past which pr-size warns
        required: false
        type: number
        default: 400

permissions:
  contents: read

jobs:
  pr-title:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR title is Conventional Commits form
        env:
          # Passed via env, never interpolated into the script: a PR title is
          # untrusted input and ${{ }} inside run: would execute it.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$PR_TITLE" | grep -Eq '^(feat|fix|perf|refactor|test|docs|build|ci|chore|style|revert)(\([^)]+\))?!?: .+'; then
            echo "::error title=PR title::Not Conventional Commits form: $PR_TITLE"
            echo "Expected 'type(scope): summary'. Types: feat, fix, perf, refactor, test, docs, build, ci, chore, style, revert"
            echo "Title the PR by its highest-impact commit."
            exit 1
          fi
          echo "PR title OK: $PR_TITLE"

  pr-size:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Advisory only — never fails the build. A big PR is sometimes correct
      # (a generated file, a mechanical rename); the reason to flag it is that
      # review quality drops past this size, which is a judgement call.
      - name: Warn when the diff is past the reviewable ceiling
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # awk, not bc/paste: one dependency-free pass, and --shortstat omits
          # the insertions or deletions clause entirely when a side is zero.
          loc=$(git diff --shortstat "$BASE_SHA...$HEAD_SHA" | awk '
            { i = 0; d = 0
              for (n = 1; n <= NF; n++) {
                if ($n ~ /^insertion/) i = $(n-1)
                if ($n ~ /^deletion/)  d = $(n-1)
              }
              print i + d }')
          loc=${loc:-0}
          echo "Changed lines: $loc"
          if [ "$loc" -gt ${{ inputs.loc-warn }} ]; then
            echo "::warning title=PR size::~$loc lines changed; the reviewable ceiling is ~${{ inputs.loc-warn }}. Consider splitting or stacking."
          fi

  pr-issue:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR names its beads issue
        env:
          # Untrusted PR text and the caller's input reach the shell only as values.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PREFIXES: ${{ inputs.prefixes }}
        run: |
          if ! printf '%s' "$PREFIXES" | grep -Eq '^[a-z0-9_-]+( [a-z0-9_-]+)*$'; then
            echo "::error title=Beads prefixes::The caller's prefixes input must be space-separated beads prefixes, got: $PREFIXES"
            exit 1
          fi
          text=$(printf '%s\n%s' "$PR_TITLE" "$PR_BODY")
          for p in $PREFIXES; do
            if printf '%s' "$text" | grep -Eq "(^|[^a-z0-9_-])$p-[a-z0-9]{2,8}(\.[0-9]+)*([^a-z0-9_-]|$)"; then
              echo "Beads issue named (prefix $p)."
              exit 0
            fi
          done
          echo "::error title=Beads issue::Name the beads issue in the PR title or body (e.g. Refs: <prefix>-<id>). Accepted prefixes: $PREFIXES"
          exit 1
